[package]
name = "gse-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core emulator patcher, DLL manager and config generator for drop-gse"

[dependencies]
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.14"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gse-engine"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
